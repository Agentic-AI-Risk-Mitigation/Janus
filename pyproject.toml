[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-guard"
version = "0.0.2"
description = "System-level security for LLM agents via fine-grained policy enforcement on tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "security", "agents", "policy", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # Core
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # Default LLM provider (OpenAI-compatible)
    "openai>=1.0,<2.0",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "authzed>=1.24.3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
google    = ["google-genai>=1.0"]
bedrock   = ["boto3>=1.26"]
langchain = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
adk       = ["google-genai>=1.0"]
all       = [
    "anthropic>=0.25",
    "google-genai>=1.0",
    "boto3>=1.26",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-mermaid2-plugin>=0.7.0",
]

[project.urls]
Documentation = "https://agentic-ai-risk-mitigation.github.io/Janus/"
Repository    = "https://github.com/Agentic-AI-Risk-Mitigation/Janus"
Issues        = "https://github.com/Agentic-AI-Risk-Mitigation/Janus/issues"

[tool.hatch.build.targets.wheel]
packages = ["janus"]

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
