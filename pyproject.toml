[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-guard"
version = "0.0.4"
description = "System-level security for LLM agents via fine-grained policy enforcement on tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "security", "agents", "policy", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # Core — the minimum for the standalone PolicyEnforcer, static-policy
    # loading, and LLM-based policy generation. No SpiceDB/authzed, no web
    # server: those live behind the optional 'pde' and 'server' extras.
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # Default LLM provider (OpenAI-compatible)
    "openai>=1.0,<2.0",
]

[project.optional-dependencies]
# SpiceDB-backed ReBAC enforcement with runtime taint tracking (PDEEnforcer).
pde       = ["authzed>=1.24.3"]
# Example web demo UI (examples/app.py).
server    = ["fastapi>=0.135.1", "uvicorn[standard]>=0.41.0"]
anthropic = ["anthropic>=0.25"]
google    = ["google-genai>=1.0"]
bedrock   = ["boto3>=1.26"]
# Claude Agent SDK adapter (janus.adapters.claude_agent_sdk). Enforces a policy
# at the SDK's PreToolUse hook / can_use_tool seams. Needs the `claude` CLI too.
claude    = ["claude-agent-sdk>=0.2"]
langchain = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
adk       = ["google-genai>=1.0"]
all       = [
    "authzed>=1.24.3",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "anthropic>=0.25",
    "google-genai>=1.0",
    "boto3>=1.26",
    "claude-agent-sdk>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
dev = [
    # PDE + server extras included so the full test suite (including the
    # SpiceDB/taint path) and demo webapp can run under `janus-guard[dev]`.
    "authzed>=1.24.3",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "claude-agent-sdk>=0.2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-mermaid2-plugin>=0.7.0",
]

[project.urls]
Documentation = "https://agentic-ai-risk-mitigation.github.io/Janus/"
Repository    = "https://github.com/Agentic-AI-Risk-Mitigation/Janus"
Issues        = "https://github.com/Agentic-AI-Risk-Mitigation/Janus/issues"

[tool.hatch.build.targets.wheel]
packages = ["janus"]

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
