name: Deploy docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install MkDocs and theme (match local versions)
        run: uv sync --extra docs --no-dev
      - name: Deploy
        run: uv run mkdocs gh-deploy --force --remote-branch docs
