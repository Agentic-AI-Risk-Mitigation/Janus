# Regression suite + lint + type check on every push/PR to main.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not incidental coverage. Claude Code reports `file_path`
        # with the host separator, so a Linux-only matrix once let a policy
        # ship that matched nothing on Windows — every secret-read deny was
        # silently allowed there. Path handling is platform-specific enough
        # that it has to be exercised on both.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Windows runs the full version sweep on one interpreter; the
          # platform-specific code paths do not vary by Python version, and
          # eight Windows runners per PR buys nothing.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev tooling + SDK adapter extra)
        run: uv sync --extra dev --extra claude
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy janus
      - name: Pytest
        run: uv run pytest -q
